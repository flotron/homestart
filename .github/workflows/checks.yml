name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py homestart scripts
      - run: node --check static/app.js
      - run: ./scripts/build_package.sh
      - run: python scripts/test_update_matrix.py --update "dist/homestart-update-$(tr -d '[:space:]' < VERSION).tar.gz" --installer "dist/homestart-installer-$(tr -d '[:space:]' < VERSION).tar.gz"

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python scripts/test_compose_integration.py
